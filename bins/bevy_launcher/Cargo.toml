[package]
name = "bevy_launcher"
version = "0.19.0-dev"
edition = "2024"
description = "A distributable launcher for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
bevy = { path = "../../", version = "0.19.0-dev", default-features = true, features = ["experimental_bevy_feathers"] }

[features]
default = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
